<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bamboo Chicken — Cashier Dashboard (POS)</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

  <!-- Sticky POS Header -->
  <header class="pos-header">
    <div class="pos-header-container">
      
      <!-- Brand & Terminal Info -->
      <div class="pos-brand-group">
        <a href="/admin" class="pos-brand-title">
          BAMBOO <span class="pos-brand-orange">CHICKEN</span> POS
        </a>
        <span class="pos-badge pos-badge-green">● Cashier Terminal #01</span>
      </div>

      <!-- Live Clock & Status -->
      <div class="pos-header-info">
        <div class="pos-clock-widget">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span id="pos-clock">--:--:--</span>
        </div>

        <a href="/" class="pos-menu-link" target="_blank" title="Open Customer Menu in new tab">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          <span>Customer Menu</span>
        </a>
      </div>

      <!-- Action Buttons -->
      <div class="pos-header-actions">
        <button type="button" class="pos-btn-icon active" id="pos-sound-btn" title="Toggle Sound Alerts" aria-label="Toggle Sound">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
        </button>

        <button type="button" class="pos-btn pos-btn-secondary" onclick="refreshOrders()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6"/><path d="M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          <span>Refresh</span>
        </button>

        <button type="button" class="pos-btn pos-btn-primary" onclick="openTestOrderModal()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>Simulate Order</span>
        </button>
      </div>

    </div>
  </header>

  <!-- Dashboard Content -->
  <main class="pos-main">

    <!-- Top KPI Statistics Bar -->
    <section class="pos-stats-grid">
      <!-- Today's Sales -->
      <div class="pos-stat-card">
        <div class="pos-stat-info">
          <span class="pos-stat-label">Today's Sales</span>
          <span class="pos-stat-value" id="stat-sales">$0.00</span>
        </div>
        <div class="pos-stat-icon pos-stat-icon-sales">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </div>
      </div>

      <!-- Orders Today -->
      <div class="pos-stat-card">
        <div class="pos-stat-info">
          <span class="pos-stat-label">Orders Today</span>
          <span class="pos-stat-value" id="stat-orders">0</span>
        </div>
        <div class="pos-stat-icon pos-stat-icon-orders">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        </div>
      </div>

      <!-- Preparing -->
      <div class="pos-stat-card">
        <div class="pos-stat-info">
          <span class="pos-stat-label">Preparing</span>
          <span class="pos-stat-value" id="stat-prep">0</span>
        </div>
        <div class="pos-stat-icon pos-stat-icon-prep">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 13.87A8 8 0 0 1 17.64 4"/><path d="M20 10v4h-4"/><path d="M17.91 18.2A8 8 0 0 1 6.34 20"/><path d="M4 14V10h4"/></svg>
        </div>
      </div>

      <!-- Ready -->
      <div class="pos-stat-card">
        <div class="pos-stat-info">
          <span class="pos-stat-label">Ready</span>
          <span class="pos-stat-value" id="stat-ready">0</span>
        </div>
        <div class="pos-stat-icon pos-stat-icon-ready">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
      </div>

      <!-- Completed -->
      <div class="pos-stat-card">
        <div class="pos-stat-info">
          <span class="pos-stat-label">Completed</span>
          <span class="pos-stat-value" id="stat-completed">0</span>
        </div>
        <div class="pos-stat-icon pos-stat-icon-completed">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        </div>
      </div>
    </section>

    <!-- Controls Toolbar (Search & Filters) -->
    <section class="pos-toolbar">
      <!-- Search Input -->
      <div class="pos-search-wrapper">
        <svg class="pos-search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="pos-search-input" class="pos-search-input" placeholder="Search order #, customer name, items..." autocomplete="off">
      </div>

      <!-- Filter Pills -->
      <div class="pos-filter-pills">
        <button type="button" class="pos-filter-pill active" data-filter="all" onclick="setFilter('all')">All Orders</button>
        <button type="button" class="pos-filter-pill" data-filter="pickup" onclick="setFilter('pickup')">Pickup Only</button>
        <button type="button" class="pos-filter-pill" data-filter="delivery" onclick="setFilter('delivery')">Delivery Only</button>
      </div>
    </section>

    <!-- Four Kanban Order Columns -->
    <section class="pos-board-grid">

      <!-- 🔴 Column 1: New Orders -->
      <div class="pos-column">
        <div class="pos-column-header">
          <div class="pos-column-title-group">
            <span class="pos-column-dot dot-red"></span>
            <h2 class="pos-column-title">New Orders</h2>
          </div>
          <span class="pos-column-count" id="count-new">0</span>
        </div>
        <div class="pos-cards-list" id="cards-list-new">
          <!-- Dynamically populated -->
        </div>
      </div>

      <!-- 🟠 Column 2: Preparing -->
      <div class="pos-column">
        <div class="pos-column-header">
          <div class="pos-column-title-group">
            <span class="pos-column-dot dot-orange"></span>
            <h2 class="pos-column-title">Preparing</h2>
          </div>
          <span class="pos-column-count" id="count-prep">0</span>
        </div>
        <div class="pos-cards-list" id="cards-list-preparing">
          <!-- Dynamically populated -->
        </div>
      </div>

      <!-- 🟢 Column 3: Ready -->
      <div class="pos-column">
        <div class="pos-column-header">
          <div class="pos-column-title-group">
            <span class="pos-column-dot dot-green"></span>
            <h2 class="pos-column-title">Ready</h2>
          </div>
          <span class="pos-column-count" id="count-ready">0</span>
        </div>
        <div class="pos-cards-list" id="cards-list-ready">
          <!-- Dynamically populated -->
        </div>
      </div>

      <!-- ⚪ Column 4: Completed -->
      <div class="pos-column">
        <div class="pos-column-header">
          <div class="pos-column-title-group">
            <span class="pos-column-dot dot-gray"></span>
            <h2 class="pos-column-title">Completed</h2>
          </div>
          <span class="pos-column-count" id="count-completed">0</span>
        </div>
        <div class="pos-cards-list" id="cards-list-completed">
          <!-- Dynamically populated -->
        </div>
      </div>

    </section>

  </main>

  <!-- Modal: Receipt Preview & Details -->
  <div class="pos-modal-overlay" id="receipt-modal-overlay">
    <div class="pos-modal">
      <div class="pos-modal-header">
        <h3 class="pos-modal-title">Order Receipt Stub</h3>
        <button type="button" class="pos-modal-close" onclick="closeReceiptModal()" aria-label="Close">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="pos-modal-body" id="modal-receipt-content">
        <!-- Rendered via JS -->
      </div>
      <div class="pos-modal-footer">
        <button type="button" class="pos-btn pos-btn-secondary" onclick="closeReceiptModal()">Close</button>
        <button type="button" class="pos-btn pos-btn-primary" onclick="printReceipt()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          <span>Print Receipt</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Modal: Simulate Test Order -->
  <div class="pos-modal-overlay" id="test-order-modal-overlay">
    <div class="pos-modal">
      <div class="pos-modal-header">
        <h3 class="pos-modal-title">Simulate Customer Order</h3>
        <button type="button" class="pos-modal-close" onclick="closeTestOrderModal()" aria-label="Close">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form onsubmit="submitTestOrder(event)">
        <div class="pos-modal-body" style="display: flex; flex-direction: column; gap: 16px;">
          <div>
            <label style="font-size: 0.85rem; font-weight: 600; color: #9CA3AF; display: block; margin-bottom: 6px;">Customer Name</label>
            <input type="text" id="test-cust-name" class="pos-search-input" style="padding-left: 14px;" placeholder="e.g. Kelvin C." required>
          </div>
          <div>
            <label style="font-size: 0.85rem; font-weight: 600; color: #9CA3AF; display: block; margin-bottom: 6px;">Order Type</label>
            <select id="test-order-type" class="pos-search-input" style="padding-left: 14px; background-color: #1C1C22;">
              <option value="Pickup">Pickup</option>
              <option value="Delivery">Delivery</option>
            </select>
          </div>
          <div>
            <label style="font-size: 0.85rem; font-weight: 600; color: #9CA3AF; display: block; margin-bottom: 6px;">Preset Food Items</label>
            <select id="test-item-preset" class="pos-search-input" style="padding-left: 14px; background-color: #1C1C22;">
              <option value="wings">2x 6-Pce Crispy Wings ($17.00)</option>
              <option value="sadza">2x Sadza & Beef Stew ($12.00)</option>
              <option value="bucket">1x Family Bucket + 2L Coke ($24.50)</option>
              <option value="burger">1x Flame-Grilled Double Burger ($9.00)</option>
            </select>
          </div>
        </div>
        <div class="pos-modal-footer">
          <button type="button" class="pos-btn pos-btn-secondary" onclick="closeTestOrderModal()">Cancel</button>
          <button type="submit" class="pos-btn pos-btn-primary">Add to POS</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="pos-toast-container" id="pos-toast-container"></div>

  <!-- POS Script -->
  <script src="/js/admin.js"></script>

</body>
</html>
