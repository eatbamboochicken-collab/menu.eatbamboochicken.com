<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Bamboo Chicken | System Upgrade</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --yellow: #ffd21c;
      --orange: #f47b20;
      --black: #111111;
      --white: #ffffff;
      --soft: #fff9df;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 15% 15%, rgba(255,210,28,.20), transparent 28%),
        radial-gradient(circle at 85% 85%, rgba(244,123,32,.16), transparent 30%),
        var(--soft);
      color: var(--black);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .page {
      width: 100%;
      max-width: 720px;
      min-height: 100vh;
      padding: 28px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Decorative background shapes */

    .shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(1px);
      opacity: .7;
      pointer-events: none;
    }

    .shape.one {
      width: 180px;
      height: 180px;
      background: var(--yellow);
      top: -90px;
      left: -70px;
    }

    .shape.two {
      width: 150px;
      height: 150px;
      background: var(--orange);
      bottom: -75px;
      right: -55px;
    }

    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      background: rgba(255,255,255,.94);
      border: 2px solid rgba(17,17,17,.08);
      border-radius: 30px;
      padding: 42px 28px 32px;
      text-align: center;
      box-shadow:
        0 25px 70px rgba(0,0,0,.12),
        0 5px 20px rgba(244,123,32,.08);
      backdrop-filter: blur(10px);
    }

    .logo-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 82px;
      height: 82px;
      background: var(--yellow);
      border-radius: 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px rgba(255,210,28,.35);
      font-size: 42px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #f4f4f4;
      border-radius: 50px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--orange);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.5);
        opacity: .45;
      }
    }

    h1 {
      font-size: clamp(36px, 8vw, 64px);
      line-height: .95;
      letter-spacing: -0.055em;
      font-weight: 900;
      margin-bottom: 18px;
    }

    h1 span {
      color: var(--orange);
    }

    .message {
      max-width: 490px;
      margin: 0 auto;
      color: #666;
      font-size: 16px;
      line-height: 1.6;
    }

    .countdown-label {
      margin-top: 34px;
      margin-bottom: 12px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #888;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 460px;
      margin: 0 auto;
    }

    .time-box {
      background: var(--black);
      color: white;
      border-radius: 18px;
      padding: 18px 8px 14px;
      min-width: 0;
    }

    .time {
      display: block;
      font-size: clamp(32px, 8vw, 48px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -.04em;
      font-variant-numeric: tabular-nums;
    }

    .unit {
      display: block;
      margin-top: 7px;
      color: #aaa;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .progress {
      height: 7px;
      background: #eee;
      border-radius: 20px;
      margin: 28px auto 22px;
      max-width: 460px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(
        90deg,
        var(--yellow),
        var(--orange)
      );
      border-radius: inherit;
      transition: width 1s linear;
    }

    .footer {
      font-size: 12px;
      color: #999;
      margin-top: 22px;
    }

    .footer strong {
      color: var(--black);
    }

    @media (max-width: 480px) {
      .page {
        padding: 18px 14px;
      }

      .card {
        padding: 34px 18px 26px;
        border-radius: 25px;
      }

      .logo-wrap {
        width: 70px;
        height: 70px;
        font-size: 35px;
      }

      .message {
        font-size: 14px;
      }

      .time-box {
        padding: 15px 5px 12px;
        border-radius: 15px;
      }

      .countdown {
        gap: 7px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="shape one"></div>
    <div class="shape two"></div>

    <section class="card">

      <!-- Temporary visual mark.
           Replace with official Bamboo Chicken logo when available. -->
      <div class="logo-wrap">
        🍗
      </div>

      <div class="status">
        <span class="dot"></span>
        System Upgrade
      </div>

      <h1>
        Bamboo Chicken<br>
        <span>is upgrading.</span>
      </h1>

      <p class="message">
        We're making things better behind the scenes.
        Please wait while we complete the upgrade.
      </p>

      <div class="countdown-label">
        We'll be back in
      </div>

      <div class="countdown">

        <div class="time-box">
          <span class="time" id="hours">24</span>
          <span class="unit">Hours</span>
        </div>

        <div class="time-box">
          <span class="time" id="minutes">00</span>
          <span class="unit">Minutes</span>
        </div>

        <div class="time-box">
          <span class="time" id="seconds">00</span>
          <span class="unit">Seconds</span>
        </div>

      </div>

      <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <p class="footer">
        <strong>Crispy & Juicy, Taste the Bamboo Magic!</strong>
      </p>

    </section>

  </main>


  <script>
    /*
      24-HOUR COUNTDOWN
      The timer is stored in localStorage so refreshing the page
      does NOT reset it.
    */

    const DURATION = 24 * 60 * 60 * 1000;

    let endTime = localStorage.getItem("bambooUpgradeEnd");

    if (!endTime) {
      endTime = Date.now() + DURATION;
      localStorage.setItem("bambooUpgradeEnd", endTime);
    }

    endTime = Number(endTime);

    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");
    const secondsEl = document.getElementById("seconds");
    const progressBar = document.getElementById("progressBar");

    function updateCountdown() {

      const now = Date.now();
      let remaining = endTime - now;

      if (remaining <= 0) {
        remaining = 0;
      }

      const totalSeconds = Math.floor(remaining / 1000);

      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      hoursEl.textContent = String(hours).padStart(2, "0");
      minutesEl.textContent = String(minutes).padStart(2, "0");
      secondsEl.textContent = String(seconds).padStart(2, "0");

      const elapsed = DURATION - remaining;
      const percentage = Math.min(
        100,
        Math.max(0, (elapsed / DURATION) * 100)
      );

      progressBar.style.width = percentage + "%";

      if (remaining <= 0) {
        clearInterval(timer);

        document.querySelector(".status").innerHTML =
          '<span class="dot"></span> Upgrade Complete';

        document.querySelector("h1").innerHTML =
          'Bamboo Chicken<br><span>is back!</span>';

        document.querySelector(".message").textContent =
          "The system upgrade is complete. Welcome back!";

        localStorage.removeItem("bambooUpgradeEnd");
      }
    }

    updateCountdown();

    const timer = setInterval(updateCountdown, 1000);
  </script>

</body>
</html>
