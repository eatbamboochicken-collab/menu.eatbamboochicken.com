<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bamboo Chicken — Rider Portal</title>
  <link rel="stylesheet" href="/css/admin.css">
  <style>
    .rider-container {
      max-width: 800px;
      margin: 20px auto 40px;
      padding: 0 16px;
    }
    .rider-profile-bar {
      background: #1C1C22;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }
    .rider-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .rider-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--pos-orange);
      color: #FFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 800;
    }
    .status-toggle-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.05);
      padding: 8px 16px;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #4B5563;
      transition: .3s;
      border-radius: 34px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #10B981;
    }
    input:checked + .slider:before {
      transform: translateX(24px);
    }
    .job-card {
      background: #1C1C22;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .job-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed rgba(255,255,255,0.1);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .job-status-tag {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      background: rgba(255, 90, 0, 0.2);
      color: #FF5A00;
      border: 1px solid rgba(255, 90, 0, 0.4);
    }
    .job-status-tag.ontheway {
      background: rgba(59, 130, 246, 0.2);
      color: #3B82F6;
      border-color: rgba(59, 130, 246, 0.4);
    }
    .job-status-tag.delivered {
      background: rgba(16, 185, 129, 0.2);
      color: #10B981;
      border-color: rgba(16, 185, 129, 0.4);
    }
    .btn-action-group {
      display: flex;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .btn-rider-action {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      border: none;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .btn-step-accept { background: #3B82F6; color: #FFF; }
    .btn-step-pickup { background: #FDB813; color: #111; }
    .btn-step-ontheway { background: #FF5A00; color: #FFF; }
    .btn-step-delivered { background: #10B981; color: #FFF; }
    .btn-nav-map {
      background: rgba(255,255,255,0.1);
      color: #FFF;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .gps-toast-bar {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(16, 185, 129, 0.95);
      color: #FFF;
      padding: 10px 18px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      z-index: 1000;
    }
  </style>
</head>
<body>

  <!-- POS Header with Role Switcher -->
  <header class="pos-header">
    <div class="pos-header-container">
      <div class="pos-brand-group">
        <a href="/admin" class="pos-brand-title">
          BAMBOO <span class="pos-brand-orange">CHICKEN</span> RIDER
        </a>
        <span class="pos-badge pos-badge-green">● Rider Dispatch Portal</span>
      </div>

      <div class="pos-header-info">
        <span style="font-size: 0.85rem; color: #9CA3AF;">Role Navigation:</span>
        <a href="/" class="pos-menu-link">Customer Menu</a>
        <a href="/kitchen.html" class="pos-menu-link">Kitchen</a>
        <a href="/cashier.html" class="pos-menu-link">Cashier</a>
        <a href="/rider.html" class="pos-menu-link" style="color: var(--pos-orange); font-weight: 800;">Rider</a>
        <a href="/admin.html" class="pos-menu-link">Admin</a>
      </div>
    </div>
  </header>

  <main class="rider-container">

    <!-- Rider Profile & Online Switcher -->
    <div class="rider-profile-bar">
      <div class="rider-info">
        <div class="rider-avatar" id="lbl-rider-avatar">🛵</div>
        <div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <select id="rider-selector" onchange="changeActiveRider(this.value);" style="background: #2A2A34; color: #FFF; border: 1px solid #444; padding: 6px 10px; border-radius: 8px; font-weight: 700; font-size: 1rem;">
              <!-- Populated via JS -->
            </select>
          </div>
          <div style="font-size: 0.85rem; color: #9CA3AF; margin-top: 4px;" id="lbl-rider-vehicle">Honda Scooter (Red)</div>
        </div>
      </div>

      <div class="status-toggle-box">
        <span style="font-weight: 700; font-size: 0.9rem;" id="lbl-online-status">OFFLINE</span>
        <label class="switch">
          <input type="checkbox" id="chk-online-status" onchange="toggleOnlineStatus(this.checked)">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- GPS Indicator -->
    <div id="gps-indicator" class="gps-toast-bar" style="display: none;">
      <span style="animation: pulse 1.5s infinite;">📡</span>
      <span>Uploading GPS Location (Every 10s)</span>
    </div>

    <!-- Assigned Jobs List -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <h2 style="font-size: 1.3rem; font-weight: 800; color: #FFF; font-family: var(--font-display);">
        🚚 My Assigned Deliveries
      </h2>
      <button type="button" class="pos-btn pos-btn-secondary" onclick="fetchRiderJobs()" style="padding: 6px 12px; font-size: 0.85rem;">
        🔄 Refresh
      </button>
    </div>

    <div id="rider-jobs-container">
      <!-- Rendered dynamically -->
    </div>

  </main>

  <script src="/js/rider.js"></script>
</body>
</html>
